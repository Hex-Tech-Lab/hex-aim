<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Clean Minimal Dark Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Clean Crisp Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- THE 'A' WITH UPWARD FASHION TRIANGLE ARROWHEAD -->
  <g id="letter-A">
    <!-- Stylized Arrowhead Apex pointing upwards -->
    <polygon points="120,118 168,188 140,188 120,154 100,188 72,188" fill="url(#arrowGrad)" />
    
    <!-- Left Stems of A -->
    <polygon points="68,206 102,206 66,356 24,356" fill="#ffffff" />
    <!-- Right Stem of A -->
    <polygon points="138,206 172,206 216,356 174,356" fill="#ffffff" />
    <!-- Horizontal Crossbar of A -->
    <rect x="68" y="278" width="104" height="28" rx="6" fill="#ffffff" />
  </g>

  <!-- THE 'I' -->
  <g id="letter-I">
    <rect x="236" y="148" width="44" height="208" rx="10" fill="#ffffff" />
    <!-- Top accent dot / pip on I in cyan -->
    <circle cx="258" cy="118" r="14" fill="#06b6d4" />
  </g>

  <!-- THE 'M' -->
  <g id="letter-M">
    <!-- Left vertical bar -->
    <rect x="304" y="148" width="40" height="208" rx="8" fill="#ffffff" />
    <!-- Right vertical bar -->
    <rect x="444" y="148" width="40" height="208" rx="8" fill="#ffffff" />
    <!-- Left diagonal down -->
    <polygon points="334,148 376,148 402,260 382,260" fill="#ffffff" />
    <!-- Right diagonal down -->
    <polygon points="454,148 412,148 386,260 406,260" fill="#ffffff" />
    <!-- Center vertex joint -->
    <polygon points="384,244 404,244 394,276" fill="url(#arrowGrad)" />
  </g>

  <!-- Clean Subtitle -->
  <text x="256" y="420"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="22"
        letter-spacing="12"
        fill="#94a3b8">MASTERY</text>
</svg>